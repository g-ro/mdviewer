[project]
name = "mdviewer"
version = "1.0.0"
description = "A markdown file viewer with tabbed interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown>=3.7",
    "tkinterweb>=3.23",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.3",
]
